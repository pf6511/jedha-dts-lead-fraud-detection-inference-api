[project]
name = "fraud-detection-inference-api"
version = "0.2.0"
description = "Fraud detection inference API: serves the production model of the MLflow registry behind an API key"
readme = "README.md"
authors = [
    { name = "mygithub", email = "mymail" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "mlflow>=3.16.1",
    "uvicorn>=0.54.0",
    "fraud-detection-contracts",
    "boto3>=1.43.108",
    "pandas>=3.0.6",
    "python-dotenv>=1.1.0",
]


[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
fraud-detection-contracts = { path = "./fraud-detection-contracts", editable = true }
